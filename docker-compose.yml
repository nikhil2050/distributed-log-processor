name: dlp-project

# Define all containers that will run
services:

  # Service name (how you reference it internally)

  # Zookeeper (required for Kafka)
  zookeeper:
    container_name: dlp-zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka for event streaming
  kafka:
    container_name: dlp-kafka
    image: confluentinc/cp-kafka:7.4.0          # Confluent's Kafka image (7.4.0 = version)
    ports:
      - "9092:9092"                             # Maps host port 9092 → container port 9092
    depends_on:
      zookeeper:
        condition: service_healthy          # ← waits for Zookeeper to pass healthcheck
    environment:
      KAFKA_BROKER_ID: 1                        # Unique ID for this Kafka broker
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181   # Connects to Zookeeper (service name)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092  # How clients connect
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
#      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    container_name: dlp-redis                   # Container name
    image: redis:7-alpine                       # Official Redis image, Alpine Linux (lightweight)
    ports:
      - "6379:6379"                             # Standard Redis port
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for data persistence
  postgres:
    container_name: dlp-postgres                # Container name
    image: postgres:15-alpine                   # Official PostgreSQL image, Alpine Linux
    environment:
      POSTGRES_DB: logprocessor                 # Initial database name
      POSTGRES_USER: loguser                    # Database user
      POSTGRES_PASSWORD: logpassword            # Database password
    ports:
      - "5432:5432"                             # Standard PostgreSQL port
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loguser" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    container_name: dlp-prometheus                # Container name
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    container_name: dlp-grafana                # Container name
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
